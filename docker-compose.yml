name: project-2-outbox

services:
  postgres:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-outbox_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-outbox_dev_password}
      POSTGRES_DB: ${POSTGRES_USER:-outbox_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-outbox_dev}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --default-log-level=info
      # This rpk build's `redpanda start` has no --set flag (confirmed via
      # `rpk redpanda start --help`); auto_create_topics_enabled is instead
      # disabled post-startup via `rpk cluster config set` in `make up`.
    ports:
      - "19092:19092"
      - "18081:18081"
      - "18082:18082"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8090}:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  migrate:
    build:
      context: .
      args: { PACKAGE: migrate-all }
    environment:
      ORDERS_DATABASE_URL: postgres://${POSTGRES_USER:-outbox_dev}:${POSTGRES_PASSWORD:-outbox_dev_password}@postgres:5432/${POSTGRES_ORDERS_DB:-orders}
      INVENTORY_DATABASE_URL: postgres://${POSTGRES_USER:-outbox_dev}:${POSTGRES_PASSWORD:-outbox_dev_password}@postgres:5432/${POSTGRES_INVENTORY_DB:-inventory}
      PAYMENTS_DATABASE_URL: postgres://${POSTGRES_USER:-outbox_dev}:${POSTGRES_PASSWORD:-outbox_dev_password}@postgres:5432/${POSTGRES_PAYMENTS_DB:-payments}
      FULFILMENT_DATABASE_URL: postgres://${POSTGRES_USER:-outbox_dev}:${POSTGRES_PASSWORD:-outbox_dev_password}@postgres:5432/${POSTGRES_FULFILMENT_DB:-fulfilment}
    depends_on:
      postgres: { condition: service_healthy }

  orders:
    build: { context: ., args: { PACKAGE: orders } }
    env_file: .env
    environment: &service_environment
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDPANDA_BROKER: redpanda:9092
    ports: ["${ORDERS_PORT:-8081}:8081"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:8081/health/ready"], interval: 5s, timeout: 3s, retries: 20 }

  inventory:
    build: { context: ., args: { PACKAGE: inventory } }
    env_file: .env
    environment: *service_environment
    ports: ["${INVENTORY_PORT:-8082}:8082"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:8082/health/ready"], interval: 5s, timeout: 3s, retries: 20 }

  payments:
    build: { context: ., args: { PACKAGE: payments } }
    env_file: .env
    environment: *service_environment
    ports: ["${PAYMENTS_PORT:-8083}:8083"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:8083/health/ready"], interval: 5s, timeout: 3s, retries: 20 }

  fulfilment:
    build: { context: ., args: { PACKAGE: fulfilment } }
    env_file: .env
    environment: *service_environment
    ports: ["${FULFILMENT_PORT:-8084}:8084"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redpanda: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fsS", "http://localhost:8084/health/ready"], interval: 5s, timeout: 3s, retries: 20 }

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.2
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    profiles: ["observability"]
    ports: ["16686:16686", "4317:4317"]

volumes:
  postgres_data:
  redpanda_data:
